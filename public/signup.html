<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup form · Bug Hunt Lab</title>
<link rel="stylesheet" href="/css/lab.css">
</head>
<body>
<main>
<h1>Signup form</h1>
<div class="task">Rules: name required · valid email · password at least <b>8</b> characters · passwords match · age 13 to 120 · one account per email.</div>
<form id="signup" novalidate>
  <label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name">
  <p class="error" id="name-error" data-testid="name-error"></p>
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
  <p class="error" id="email-error" data-testid="email-error"></p>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password">
  <p class="error" id="password-error" data-testid="password-error"></p>
  <label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password">
  <p class="error" id="confirm-error" data-testid="confirm-error"></p>
  <label for="age">Age</label><input id="age" name="age" type="number" inputmode="numeric">
  <p class="error" id="age-error" data-testid="age-error"></p>
  <p><button type="submit" id="submit">Create account</button></p>
  <p id="result" role="status" data-testid="result"></p>
</form>
</main>
<script type="module" src="/js/signup.js"></script>
</body>
</html>
