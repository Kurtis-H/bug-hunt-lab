name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:unit

  e2e:
    name: Reference suite passes on the correct app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:solutions
      - name: Starter tests pass too
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  scorecard:
    name: Every bug is real and catchable
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The reference suite must catch 100% of bugs. If a code change accidentally
      # "fixes" a bug or makes one undetectable, this fails.
      - run: npm run scorecard -- --tests solutions/e2e --min-score 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: scorecard.md
